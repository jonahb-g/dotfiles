# Prefix: remap from default Ctrl+b to Ctrl+a (easier reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window/pane numbering at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Quality of life
set -g mouse on
set -g history-limit 10000
setw -g mode-keys vi

# More intuitive split keys (| vertical split, - horizontal split)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Status bar, roughly matching your rose-pine theme
set -g status-style bg='#232136',fg='#e0def4'
set -g status-left "#[fg=#c4a7e7,bold] #S "
set -g status-right "#[fg=#ea9a97] %H:%M "
setw -g window-status-current-style bg='#393552',fg='#e0def4',bold

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
