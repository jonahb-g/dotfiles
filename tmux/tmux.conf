# Prefix: remap from default Ctrl+b to Ctrl+a (easier reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window/pane numbering at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Quality of life
set -g set-clipboard on  # let nvim copy to the macOS clipboard over OSC 52
set -g mouse on
set -g history-limit 10000
setw -g mode-keys vi

# Truecolor support (so nvim's rose-pine theme renders correctly inside tmux)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc"

# More intuitive split keys (| vertical split, - horizontal split)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Highlight the active pane's border
set -g pane-border-style fg='#393552'
set -g pane-active-border-style fg='#c4a7e7'
set -g pane-border-lines heavy

# Status bar, roughly matching your rose-pine theme
setw -g window-status-current-style bg='#393552',fg='#e0def4',bold

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
bind b last-window
bind x kill-pane
